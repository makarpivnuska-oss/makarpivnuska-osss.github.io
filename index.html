<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonationAlerts — Донаты</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/centrifuge/4.0.1/centrifuge.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: #f95a2c; margin-bottom: 8px; font-size: 28px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }

    .status-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      margin-bottom: 30px;
      min-width: 360px;
    }
    .status-card .label { color: #888; font-size: 13px; margin-bottom: 6px; }
    .status-card .value { font-size: 18px; font-weight: 600; }
    .online { color: #4caf50; }
    .offline { color: #f44336; }

    .btn {
      display: inline-block;
      background: #f95a2c;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: background .2s;
      margin-bottom: 30px;
    }
    .btn:hover { background: #e04a1c; }

    .donations {
      width: 100%;
      max-width: 600px;
    }
    .donations h2 {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 8px;
    }
    .donation-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }
    .donation-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .donation-item .username { font-weight: 600; color: #f95a2c; }
    .donation-item .amount { font-weight: 700; color: #4caf50; font-size: 18px; }
    .donation-item .message { color: #aaa; font-size: 14px; }
    .empty { color: #555; text-align: center; padding: 40px 0; }
    .log { color: #555; font-size: 12px; margin-top: 30px; max-width: 600px; word-break: break-all; }
    .log div { margin-bottom: 4px; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>DonationAlerts</h1>
  <p class="subtitle">Приём донатов в реальном времени</p>

  <div class="status-card">
    <div class="label">Статус</div>
    <div class="value" id="status">Не подключено</div>
    <div class="label" style="margin-top:10px" id="user-info"></div>
  </div>

  <button class="btn" id="connect-btn" onclick="startAuth()">Подключить DonationAlerts</button>

  <div class="donations">
    <h2>Донаты в реальном времени</h2>
    <div id="donation-list">
      <div class="empty">Подключитесь и ждите донатов...</div>
    </div>
  </div>

  <div class="log" id="log"></div>

  <script>
    // ══════════════════════════════════════════════════════════════
    //  НАСТРОЙКИ — поменяй под своё приложение
    // ══════════════════════════════════════════════════════════════
    const CONFIG = {
      CLIENT_ID: '18533',
      // redirect_uri ДОЛЖЕН совпадать с тем, что указан в DA
      REDIRECT_URI: 'https://makarpivnuska-oss.github.io/makarpivnuska-osss.github.io/callback',
      SCOPES: 'oauth-user-show oauth-donation-index oauth-donation-subscribe',
    };
    // ══════════════════════════════════════════════════════════════

    const statusEl     = document.getElementById('status');
    const userInfoEl   = document.getElementById('user-info');
    const connectBtn   = document.getElementById('connect-btn');
    const donationList = document.getElementById('donation-list');
    const logEl        = document.getElementById('log');
    let hasDonations   = false;

    function log(msg) {
      console.log(msg);
      const d = document.createElement('div');
      d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(d);
    }

    // ── OAuth (implicit flow: token в URL hash) ──────────────────
    function startAuth() {
      const url =
        `https://www.donationalerts.com/oauth/authorize` +
        `?client_id=${CONFIG.CLIENT_ID}` +
        `&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}` +
        `&response_type=token` +
        `&scope=${encodeURIComponent(CONFIG.SCOPES)}`;
      window.location.href = url;
    }

    // Проверяем, вернулся ли токен в hash
    function getTokenFromHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return null;
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    // ── Работа с API ─────────────────────────────────────────────
    async function fetchProfile(token) {
      const res = await fetch('https://www.donationalerts.com/api/v1/user/oauth', {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`Profile fetch failed: ${res.status}`);
      const data = await res.json();
      return data.data;
    }

    async function fetchDonationHistory(token) {
      try {
        const res = await fetch('https://www.donationalerts.com/api/v1/alerts/donations', {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return [];
        const data = await res.json();
        return data.data || [];
      } catch (e) {
        log('Не удалось загрузить историю: ' + e.message);
        return [];
      }
    }

    // ── Centrifugo WebSocket ─────────────────────────────────────
    function connectCentrifugo(profile) {
      const socketToken = profile.socket_connection_token;
      if (!socketToken) {
        log('⚠️ Нет socket_connection_token — реалтайм недоступен');
        return;
      }

      const centrifuge = new Centrifuge(
        'wss://centrifugo.donationalerts.com/connection/websocket',
        { token: socketToken }
      );

      centrifuge.on('connected', (ctx) => {
        log('🔌 WebSocket подключён');
      });

      centrifuge.on('disconnected', (ctx) => {
        log('🔌 WebSocket отключён: ' + ctx.reason);
      });

      const channel = `$alerts:donation_${profile.id}`;
      const sub = centrifuge.newSubscription(channel, {
        token: socketToken,
      });

      sub.on('publication', (ctx) => {
        const d = ctx.data;
        log(`💰 ${d.username || 'Аноним'}: ${d.amount} ${d.currency}`);
        addDonation(d);
      });

      sub.on('subscribing', () => log('📡 Подключаюсь к каналу донатов...'));
      sub.on('subscribed', () => log('📡 Подписан на донаты!'));
      sub.on('error', (ctx) => log('❌ Ошибка подписки: ' + JSON.stringify(ctx)));

      sub.subscribe();
      centrifuge.connect();
    }

    // ── UI ────────────────────────────────────────────────────────
    function addDonation(d) {
      if (!hasDonations) {
        donationList.innerHTML = '';
        hasDonations = true;
      }
      const div = document.createElement('div');
      div.className = 'donation-item';
      div.innerHTML = `
        <div class="top">
          <span class="username">${escapeHtml(d.username || 'Аноним')}</span>
          <span class="amount">${d.amount} ${d.currency}</span>
        </div>
        <div class="message">${escapeHtml(d.message || '—')}</div>
      `;
      donationList.prepend(div);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Запуск ───────────────────────────────────────────────────
    async function init() {
      const token = getTokenFromHash();
      if (!token) {
        log('Нажмите "Подключить" для авторизации');
        return;
      }

      // Убираем токен из URL (чтобы не светился)
      history.replaceState(null, '', window.location.pathname);

      statusEl.textContent = 'Подключение...';
      connectBtn.style.display = 'none';
      log('✅ Токен получен');

      try {
        const profile = await fetchProfile(token);
        log(`✅ Пользователь: ${profile.name} (id: ${profile.id})`);

        statusEl.textContent = 'Подключено ✓';
        statusEl.className = 'value online';
        userInfoEl.textContent = `Пользователь: ${profile.name}`;

        // Загрузить историю
        const history = await fetchDonationHistory(token);
        history.forEach(addDonation);
        log(`📋 Загружено ${history.length} донатов из истории`);

        // Подключить реалтайм
        connectCentrifugo(profile);

      } catch (e) {
        statusEl.textContent = 'Ошибка';
        statusEl.className = 'value offline';
        connectBtn.style.display = 'inline-block';
        log('❌ ' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
